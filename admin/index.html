<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Quản trị — Việt Ego Lab</title>
  <link rel="icon" type="image/png" href="../images/logo-wordmark.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Be+Vietnam+Pro:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="admin.css" />
</head>
<body>
  <!-- Login -->
  <section class="login" id="loginView" hidden>
    <form class="login__card" id="loginForm">
      <img src="../images/logo-wordmark.png" alt="Việt Ego Lab" class="login__logo" />
      <h1>Trang quản trị</h1>
      <label>Email<input type="email" name="email" required autocomplete="username" /></label>
      <label>Mật khẩu<input type="password" name="password" required autocomplete="current-password" /></label>
      <p class="error" id="loginError" role="alert"></p>
      <button class="btn" type="submit">Đăng nhập</button>
    </form>
  </section>

  <!-- Config missing -->
  <section class="login" id="setupView" hidden>
    <div class="login__card">
      <h1>Chưa cấu hình Supabase</h1>
      <p>Điền <code>url</code> và <code>anonKey</code> trong <code>js/config.js</code> theo hướng dẫn ở <code>docs/setup-supabase-vercel.md</code>.</p>
    </div>
  </section>

  <!-- App -->
  <div class="app" id="appView" hidden>
    <aside class="side">
      <img src="../images/logo-wordmark.png" alt="Việt Ego Lab" class="side__logo" />
      <nav class="side__nav" id="tabs">
        <button data-tab="dashboard" class="is-active">Tổng quan</button>
        <button data-tab="orders">Đơn hàng</button>
        <button data-tab="products">Sản phẩm</button>
        <button data-tab="subscribers">Đăng ký nhận tin</button>
      </nav>
      <div class="side__foot">
        <span id="userEmail"></span>
        <a href="../" target="_blank" rel="noopener">Xem cửa hàng ↗</a>
        <button id="logoutBtn">Đăng xuất</button>
      </div>
    </aside>

    <main class="main">
      <section data-panel="dashboard">
        <h2>Tổng quan</h2>
        <div class="stats" id="stats"></div>
        <h3>Đơn hàng gần đây</h3>
        <div id="recentOrders"></div>
      </section>

      <section data-panel="orders" hidden>
        <div class="panel-head">
          <h2>Đơn hàng</h2>
          <select id="orderFilter" aria-label="Lọc theo trạng thái"></select>
        </div>
        <div id="ordersTable"></div>
      </section>

      <section data-panel="products" hidden>
        <div class="panel-head">
          <h2>Sản phẩm</h2>
          <button class="btn" id="addProductBtn">+ Thêm sản phẩm</button>
        </div>
        <div id="productsTable"></div>
      </section>

      <section data-panel="subscribers" hidden>
        <div class="panel-head">
          <h2>Đăng ký nhận tin</h2>
          <button class="btn btn--ghost" id="copyEmailsBtn">Sao chép tất cả email</button>
        </div>
        <div id="subscribersTable"></div>
      </section>
    </main>
  </div>

  <!-- Modal (order detail / product form) -->
  <div class="modal" id="modal" hidden>
    <div class="modal__backdrop" data-close></div>
    <div class="modal__panel" role="dialog" aria-modal="true">
      <button class="modal__close" data-close aria-label="Đóng">×</button>
      <div id="modalBody"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="../js/config.js"></script>
  <script src="admin.js"></script>
</body>
</html>
